# 移动端（手机版布局）配置示例
#
# 用途：让被操作的浏览器以 Android Chrome 的身份打开网页 QQ，
# 从而走手机版布局（入口更全）。
#
# 用法：
#   pnpm dsh web --patch /绝对路径/examples/mobile-cordis.yml
#
# 前提：Chrome 已用 --remote-debugging-port=9222 启动并登录小号。
- insert:
    - id: qq-pilot
      name: 'dsh-plugin-qq-pilot'
      config:
        cdpUrl: 'http://127.0.0.1:9222'
        qqUrl: 'https://web.qq.com/'
        mobile: true
        mobileWidth: 390
        mobileHeight: 844
        userAgent: ''            # 留空用内置 Android 15 UA
        activeHours: '12:00-13:00,18:00-19:00'
        dailyAddCap: 3
        minActionGapSec: 60
        dryRun: true
        cookiesFile: ''
        selectors:
          chatList: ''
          inputBox: ''
          sendButton: ''
          recommendList: ''
          addButton: ''
          confirmButton: ''
